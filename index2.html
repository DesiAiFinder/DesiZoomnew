Add these lines INSIDE the <head> tag of your index.html:

<!-- PWA -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#e07820" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DesiZoom" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />

Then add this BEFORE the closing </body> tag:

<!-- Service Worker registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>

-----------------------------------------------------------------------
Your full index.html should look roughly like this afterward:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesiZoom — Everything Desi</title>
    <meta name="description" content="Find desi deals, businesses, roommates, events & radio near you." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e07820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DesiZoom" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- ... your existing font/style links ... -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
