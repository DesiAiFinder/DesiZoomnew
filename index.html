<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesiZoom — Everything Desi</title>
    <meta name="description" content="Order pickup from desi restaurants, book priests and caterers, find local deals and events — all for your city." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="shortcut icon" href="/icons/icon-192.png" />

    <!-- Open Graph (WhatsApp / social link previews).
         These are the defaults for the app shell. Individual listings get their
         own title/description/image from api/preview.js — vercel.json routes
         crawlers there so shared deals preview properly. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DesiZoom" />
    <meta property="og:title" content="DesiZoom — Everything Desi" />
    <meta property="og:description" content="Order pickup from desi restaurants. Book priests, caterers and mehndi artists. Local deals, temple events and more — one place, for your city." />
    <meta property="og:image" content="https://www.desizoom.com/icons/icon-512.png" />
    <meta property="og:url" content="https://www.desizoom.com" />
    <meta name="twitter:card" content="summary" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ef9f27" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DesiZoom" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
